name: Auto Revert Temporary Changes

on:
  schedule:
    # Runs every 6 hours to check if target revert date has arrived
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_revert:
        description: 'Force immediate revert regardless of target date'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  auto-revert:
    name: Auto Revert Temporary Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Date and Revert
        run: |
          TARGET_DATE="2026-10-13"
          TARGET_TAG="temp-feature-to-revert"
          FORCE_REVERT="${{ github.event.inputs.force_revert }}"
          CURRENT_DATE=$(date -u +"%Y-%m-%d")

          echo "=== Auto-Revert Job Info ==="
          echo "Current Date (UTC): $CURRENT_DATE"
          echo "Target Date:        $TARGET_DATE"
          echo "Target Tag:         $TARGET_TAG"
          echo "Force Revert:       $FORCE_REVERT"

          # Check if target tag exists
          if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "::warning ::Tag '$TARGET_TAG' not found in repository. No revert needed."
            echo "### ⚠️ Auto-Revert Status: Tag Not Found" >> $GITHUB_STEP_SUMMARY
            echo "The tag \`$TARGET_TAG\` was not found in the git history." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TARGET_SHA=$(git rev-parse "$TARGET_TAG")
          echo "Target commit SHA: $TARGET_SHA"

          # Check if this SHA has already been reverted
          if git log --grep="This reverts commit $TARGET_SHA" -n 1 --oneline | grep -q .; then
            echo "Commit $TARGET_SHA has already been reverted in history."
            echo "### ℹ️ Auto-Revert Status: Already Reverted" >> $GITHUB_STEP_SUMMARY
            echo "Commit \`$TARGET_SHA\` was previously reverted." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Convert to integer YYYYMMDD for clean date comparison
          CURRENT_INT=$(date -u +"%Y%m%d")
          TARGET_INT=$(echo "$TARGET_DATE" | tr -d '-')

          if [ "$CURRENT_INT" -ge "$TARGET_INT" ] || [ "$FORCE_REVERT" = "true" ]; then
            echo "Target date reached ($CURRENT_DATE >= $TARGET_DATE) or force revert requested. Reverting commit $TARGET_SHA..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Revert the commit cleanly
            git revert "$TARGET_SHA" --no-edit

            # Push revert back to main branch
            git push origin main

            echo "### ✅ Auto-Revert Completed Successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Reverted Commit**: \`$TARGET_SHA\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Date Executed**: $CURRENT_DATE UTC" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Pushed revert commit to \`main\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Target date ($TARGET_DATE) has not been reached yet. Current date is $CURRENT_DATE."
            echo "### ⏳ Auto-Revert Status: Pending" >> $GITHUB_STEP_SUMMARY
            echo "- **Scheduled Revert Date**: $TARGET_DATE" >> $GITHUB_STEP_SUMMARY
            echo "- **Current Date**: $CURRENT_DATE" >> $GITHUB_STEP_SUMMARY
            echo "- **Action**: No changes made yet. Will check again on next scheduled run." >> $GITHUB_STEP_SUMMARY
          fi
